# 키트 기본 모델 카탈로그 (키트 소유: upgrade로 갱신된다). 프로젝트 조정은 orchestration/models.yaml.
#
# 점수는 1~5 상대값이다(소수 가능).
#   quality  어려운 작업을 한 번에 끝낼 기대
#   speed    끝나는 빠르기
#   cost     구독 한도 소모(높을수록 아껴 쓴다)
# strengths: 이 태그가 붙은 작업에서 가점. 태그는 routing.py TAG_WORDS
#            (design contract integration coding refactor debug test frontend docs config research review).
# efforts:   Orca --effort로 줄 수 있는 값. 비우면 effort를 주지 않는다.
# model_by_effort: 추론 수준이 모델 ID에 들어 있는 경우(effort 대신 ID를 고른다).
# family:    판 번호 자리를 {v}로 적은 꼴(예: gpt-{v}-sol). CLI 모델 목록에서 그 꼴의 가장 높은 판을 자동으로 쓴다.
#            {effort}가 있으면 그 판의 effort별 ID로 model_by_effort를 만든다. model/model_by_effort는 목록을 모를 때의 기본값.
#            models.yaml에서 model을 직접 덮어쓰면 그 항목은 계열을 따라가지 않는다.
# quality는 공개 벤치마크가 있으면 그것으로 바뀐다: bench_name('GPT-{v} Sol')·agents.*.bench_agent('Codex')로
#            tools/bench_scores.yaml(Terminal-Bench, models.py bench로 갱신)의 줄을 찾아 5 × 해결률/최고 해결률(최저 1).
#            여기 적힌 quality는 벤치 점수가 없을 때의 추정값이다. speed·cost·strengths는 아직 사람이 정한 값이다.
# 투입 결과가 쌓이면 학습 보정이 덧붙고(models.py stats), 맞지 않으면 models.yaml models:에서 키 단위로 덮어쓴다
# (models.yaml에서 quality를 정하면 벤치 점수로 바꾸지 않는다).
# quota_group / quota_extra: 잔여 한도(Orca rateLimits)에서 이 모델에 걸리는 창. 묶음별로 세는 구독(Antigravity)은 묶음 이름,
#            모델별 창이 더 있는 구독(Claude Fable 주간)은 창 이름. agents.*.quota는 Orca 공급자 이름(기본 = 에이전트 ID).
version: "2026-11"

# 에이전트 = 구독. Orca --agent ID → 실행 파일, 모델 목록 조회 방법, 자체 업데이트 명령(models.py update · launch.sh 하루 한 번)
agents:
  claude:      {bin: claude, list: none,  update: [update], bench_agent: 'Claude Code'}   # Claude 구독(Claude Code). 별칭(fable/opus/sonnet/haiku)은 최신 판을 따른다
  codex:       {bin: codex,  list: codex, update: [update], bench_agent: 'Codex'}   # ChatGPT 구독(Codex OAuth)
  antigravity: {bin: agy,    list: agy,   update: [update], bench_agent: 'Antigravity CLI'}   # Google 구독(Antigravity CLI). 공식 설치본(curl -fsSL https://antigravity.google/cli/install.sh | bash)을 쓴다. snap 설치본은 워커로 못 쓴다(orca CLI 실행 불가). 작업 폴더 신뢰 필요
  grok:        {bin: grok,   list: grok,  update: [update], bench_agent: 'Grok Build'}   # xAI 구독(Grok CLI). Orca 설정에서 에이전트를 켜야 한다

models:
  # ── Claude
  claude-fable:
    agent: claude
    quota_extra: [fableWeekly]       # Fable은 주간 한도를 따로 센다(Orca rateLimits)
    model: fable
    bench_name: 'Fable {v}'
    quality: 5
    speed: 1
    cost: 5
    efforts: [low, medium, high, xhigh, max]
    strengths: [design, contract, integration, review]
  claude-opus:
    agent: claude
    model: opus
    bench_name: 'Opus {v}'
    quality: 5
    speed: 2
    cost: 4
    efforts: [low, medium, high, xhigh, max]
    strengths: [design, contract, integration, review, docs]
  claude-sonnet:
    agent: claude
    model: sonnet
    bench_name: 'Sonnet {v}'
    quality: 4
    speed: 3
    cost: 3
    efforts: [low, medium, high, xhigh, max]
    strengths: [coding, frontend, test, docs]
  claude-haiku:
    agent: claude
    model: haiku
    bench_name: 'Haiku {v}'
    quality: 2
    speed: 5
    cost: 1
    efforts: [low, medium, high, xhigh, max]   # TB 4.1은 max로 쟀다
    strengths: [docs, config]
  # ── Codex (ChatGPT)
  codex-astra:
    agent: codex
    model: gpt-6-astra
    family: 'gpt-{v}-astra'
    bench_name: 'GPT-{v} Astra'
    quality: 5
    speed: 2
    cost: 4
    efforts: [low, medium, high, xhigh, max]
    strengths: [coding, debug, refactor, design]
  codex-sol:
    agent: codex
    model: gpt-6.1-sol
    family: 'gpt-{v}-sol'
    bench_name: 'GPT-{v} Sol'
    quality: 4
    speed: 3
    cost: 2
    efforts: [low, medium, high, xhigh, max]
    strengths: [coding, refactor, debug, test, review]
  codex-terra:
    agent: codex
    model: gpt-6.1-terra
    family: 'gpt-{v}-terra'
    bench_name: 'GPT-{v} Terra'
    quality: 3
    speed: 4
    cost: 2
    efforts: [low, medium, high, xhigh, max]
    strengths: [coding, test, config]
  codex-luna:
    agent: codex
    model: gpt-6-luna
    family: 'gpt-{v}-luna'
    bench_name: 'GPT-{v} Luna'
    quality: 2
    speed: 5
    cost: 1
    efforts: [low, medium, high, xhigh, max]
    strengths: [config, docs]
  # ── Antigravity (Google)
  agy-gemini-neon:          # Gemini 4 Neon. 추론 수준이 모델 ID에 들어 있다
    agent: antigravity
    quota_group: Gemini Models       # Antigravity 한도 묶음
    model: gemini-4-neon-medium
    family: 'gemini-{v}-neon-{effort}'
    model_by_effort: {low: gemini-4-neon-low, medium: gemini-4-neon-medium, high: gemini-4-neon-high, xhigh: gemini-4-neon-xhigh}
    bench_name: 'Gemini {v} Neon'
    quality: 4
    speed: 3
    cost: 2
    efforts: []
    strengths: [frontend, design, research, review]
  agy-gemini-carbon:        # Gemini 4 Carbon. TB 4.1은 neon보다 높고(64.5 vs 61.2), AA는 neon이 작업당 비용 약 17% 낮다고 본다(2026-11-18)
    agent: antigravity
    quota_group: Gemini Models
    model: gemini-4-carbon-medium
    family: 'gemini-{v}-carbon-{effort}'
    model_by_effort: {low: gemini-4-carbon-low, medium: gemini-4-carbon-medium, high: gemini-4-carbon-high}
    bench_name: 'Gemini {v} Carbon'
    quality: 3
    speed: 3
    cost: 2.5
    efforts: []
    strengths: [frontend, docs, research]
  agy-claude-opus:          # 다른 구독 한도로 Claude 계열을 쓰는 대체 경로
    agent: antigravity
    quota_group: Claude and GPT models
    model: claude-opus-5-5-medium
    family: 'claude-opus-{v}-{effort}'
    model_by_effort: {low: claude-opus-5-5-low, medium: claude-opus-5-5-medium, high: claude-opus-5-5-high}
    bench_name: 'Opus {v}'
    quality: 4
    speed: 2
    cost: 2
    efforts: []
    strengths: [design, review]
  # ── Grok (xAI)
  grok:
    agent: grok
    model: grok-4.7
    family: 'grok-{v}'
    bench_name: 'Grok {v}'
    quality: 4
    speed: 3
    cost: 2
    efforts: [low, medium, high]
    strengths: [coding, research]
  # grok-4.7-build-fast는 넣지 않는다(effort를 받지 않는 빠른 판). 쓰려면 models.yaml models:에 직접 추가
