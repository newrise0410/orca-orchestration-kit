# 모델 자동 라우팅 정책 (프로젝트 소유). 이 파일이 없으면 launch.sh는 라우팅을 쓰지 않는다.
#
# launch.sh는 작업에 agent/model이 없으면 여기 정책으로 (에이전트, 모델, effort)를 고른다.
#   1) 작업 분류: 계층·쓰기 범위·완료 조건 수·어려운 말·성능 측정·선행 수 → 난이도 1~5와 태그
#   2) 후보 점수: 능력 부족 벌점(품질 = 벤치마크) + 구독 소모·느림 벌점(목표별 가중) + 강점 가점 + 실적(학습) − 부하 − 잔여 한도 빠듯
#   3) 제외: 설치 안 된 CLI, 모델 목록에 없는 모델, 쿨다운, 한도 소진, 동시 상한, min_quality
# 확인: python3 orchestration/tools/models.py discover | update | plan | route <ID> | stats
# 모델 판: 카탈로그 family:(예: gpt-{v}-sol)가 CLI 목록에서 가장 높은 판을 고른다. 여기 models:에서 model을 직접 정하면 그 항목은 고정된다
# 우선순위: launch.sh --agent/--model > 작업 항목 agent/model(route: <카탈로그 키>) > kit.yaml review.* (검토) > 이 라우팅 > kit.yaml orca.agent
# 카탈로그(모델별 점수): orchestration/tools/model_catalog.yaml (키트 소유, upgrade로 갱신)

routing:
  enabled: true
  objective: balanced          # quality | balanced | economy | speed  (작업 항목 objective:로 그 작업만 바꿀 수 있다)
  agents: {{ROUTING_AGENTS}}   # 쓸 구독(Orca 에이전트 ID). claude, codex, antigravity, grok
  exclude: []                  # 쓰지 않을 카탈로그 키 (예: [claude-fable])
  max_concurrent:              # 구독별 동시 워커 상한 (한도 보호). 모두 차면 상한을 무시하고 가장 나은 쪽
    claude: 4
    codex: 4
    antigravity: 2
    grok: 2
  cross_review: true           # 검토 워커는 구현한 구독과 다른 쪽을 우선 (같은 맹점을 덜 공유)
  escalate_on_retry: true      # 앞선 시도가 실패한 작업은 난이도를 올리고 실패한 모델을 피한다
  learn: true                  # 투입 결과(dispatch.tsv × tasks.yaml × 검토 판정)로 모델 점수를 보정
  critical_dependents: 5       # 뒤에 기대는 미완료 작업이 이만큼이면 임계 경로: 능력 부족 벌점·속도 가중을 올린다
  min_quality: {}              # 계층별 최저 품질 (예: {L1: 4})
  prefer: {}                   # 태그별 선호 카탈로그 키 (+2점. 예: {frontend: agy-gemini-neon})
  pin: {}                      # 고정 (예: {review: codex-sol, L1: claude-opus}). 쓸 수 없으면 무시
  auto_update: daily           # 구독 CLI 자체 업데이트(claude·codex·agy·grok update): daily | weekly | off. launch.sh가 워커를 띄우기 전 한 번, 뒤이어 모델 목록을 다시 읽는다
  quota:                       # 잔여 한도(Orca가 모으는 구독별 사용률, orca account list). 확인: models.py quota
    enabled: true
    hard_percent: 98           # 창(5시간 세션·주간·모델별) 하나라도 이 이상이면 초기화까지 제외. 모두 소진이면 launch.sh가 보류
    session_soft: 70           # 5시간 창이 이보다 차면 벌점(100%에서 −2)
    pace_margin: 10            # 주간 사용률이 지난 기간 비율보다 이만큼(%p) 넘게 앞서면 벌점(최대 −2)
    use_it_hours: 24           # 주간 창이 이 시간 안에 초기화되는데 40% 넘게 남았으면 +0.5 (안 쓰면 사라지는 한도)
    on_exhausted: switch       # 도는 워커의 구독이 한도 100%(정지 점검 '한도 정지')일 때 quota_switch.py: switch(진행분 보존 → 다른 구독으로 이어받기) | wait
    wait_minutes: 30           # 막은 창이 이 시간 안에 풀리면 전환하지 않고 기다린다
    switch_min_headroom: 30    # 넘겨받을 구독은 창마다 이만큼(%) 남아 있어야 한다
    switch_need_minutes: 120   # 넘겨받을 구독이 지금 소모 속도로 이 시간(또는 앞 워커가 풀릴 때까지 중 짧은 쪽) 안에 다시 차면 넘기지 않는다
  on_filter: switch            # 워커가 안전 필터·이용 정책 차단으로 끊기면(정지 점검 '필터 중단') quota_switch.py: switch(이어받기, 그 모델은 그 작업 후보에서 뺀다) | wait
  bench: true                  # 품질을 공개 벤치마크(Terminal-Bench, tools/bench_scores.yaml)로. false면 카탈로그 추정값
  daily_soft_tokens: {}        # 하루 출력 토큰 기준(Orca 집계, 모든 프로젝트 합). 넘으면 벌점 (예: {claude: 2000000})

# 에이전트 설정 덮어쓰기 (예: snap 격리 설치본이 orca CLI를 부를 수 있게 손봤다면 antigravity: {allow_confined: true})
agents: {}

# 카탈로그 덮어쓰기·추가 (같은 꼴, 키 단위 병합). 새 모델은 models.py discover의 '카탈로그에 없는 모델'에서 고른다.
#   claude-opus: {cost: 3}
#   codex-sol-fast: {agent: codex, model: gpt-6.1-sol, quality: 4, speed: 4, cost: 3, efforts: [low, medium], strengths: [coding]}
models: {}

# 작업 분류 단어 더하기 (기본 목록은 routing.py)
classifier:
  hard_words: []
  easy_words: []
  tag_words: {}                # 예: {frontend: [admin/, 화면설계]}

# JEV 난이도 판정 (선택, 기본 꺼짐). TypeSafe의 판정 전용 모델에 작업 제목·완료 조건만 보내 난이도(1~5)를 받는다.
#   켜려면 enabled: true와 환경 변수 TYPESAFE_API_KEY가 필요하다. 키·네트워크가 없거나 실패하면 규칙 분류만 쓴다.
#   작업 내용이 외부(api.typesafe.ai)로 나간다. 배포 제한 프로젝트에서는 켜지 않는다.
#   shadow: 기록만 한다(dispatch.tsv 11번째 칸). models.py stats가 규칙 분류와 결과를 비교해 보여 준다.
#   live: 신뢰도가 min_confidence 이상이면 JEV 난이도로 라우팅한다. 작업에 difficulty를 직접 줬으면 묻지 않는다.
#   같은 내용은 state/jev_cache.json에서 다시 쓰고, 대시보드는 캐시만 읽는다.
jev:
  enabled: false
  mode: shadow                 # shadow | live
  min_confidence: 0.6
  timeout: 8
