# orca-orchestration-kit 프로젝트 설정 — 키트 도구(render_spec, validate_dag, launch, cleanup, 대시보드)가 읽는다.
# init이 만들고, 이후에는 매니저가 고친다. upgrade는 이 파일을 덮어쓰지 않는다(새 키만 알려 준다).
kit_version: "{{KIT_VERSION}}"

project:
  name: "{{PROJECT_NAME}}"
  slug: "{{PROJECT_SLUG}}"           # 컨테이너·네트워크·로컬 저장소 이름 접두
  main_branch: "{{MAIN_BRANCH}}"
  commit_email: "{{COMMIT_EMAIL}}"   # 공용 주소. 개인 이메일 금지(확인 훅이 자율 실행을 멈춘다)
  build_cmd: "{{BUILD_CMD}}"
  test_cmd: "{{TEST_CMD}}"
  # 브랜치를 올릴 git 원격. 빈 값("")이면 로컬 전용 운영: 워커는 `git push . HEAD:<브랜치>`로 로컬 브랜치만 갱신하고,
  # pre-push 훅(install_hooks.sh)이 원격 push를 막는다. 원격 push가 배포를 일으키는 저장소에 쓴다.
  git_remote: "{{GIT_REMOTE}}"
  protected_branches: [{{PROTECTED_BRANCHES}}]   # 원격 push에 승인(KIT_PUSH_OK=1)이 필요한 브랜치 (pre-push 훅)
  restricted: {{RESTRICTED_YAML}}   # 배포 제한 파일 패턴 (pre-push 훅·run.sh 제외 목록)

# 모듈 = int/<key> 통합 브랜치 = L1 통합 세션 1개. common·system은 예약어(공통 기반·체계 통합)
modules:
{{MODULES_YAML}}

waves:
  - {key: W0, name: W0 계약·공통기반}
  - {key: G-0, name: G-0 기반머지}
  - {key: W1, name: W1 요구사항}
  - {key: W2, name: W2 모듈통합}
  - {key: W3, name: W3 체계통합}
gates: [G-0]

paths:
  tasks: orchestration/tasks.yaml
  tasks_archive: orchestration/tasks.archive.yaml   # archive_tasks.py가 옮긴 merged 작업 (도구가 함께 읽는다)
  specs: orchestration/specs
  templates: orchestration/templates
  docs: docs
  evidence: "docs/06_evidence/{id}/report.md"
  evidence_dir: 06_evidence
  rtm: "docs/{{REQ_FOLDER}}/01_요구사항추적표_*.md"
  tbd: "docs/{{REQ_FOLDER}}/02_TBD관리대장_*.md"
  skip_dirs: [snapshots]

# 명세 템플릿 선택 (layer별). 없으면 default.
# 작업 항목에 spec_template: <파일>을 주면 그것이 우선한다(예: 검토 작업은 review-spec.md)
spec_templates:
  L1: integration-spec.md
  default: worker-spec.md

# 구현 검토 워커 고정값 (launch.sh --review). 비우면 모델 자동 라우팅(orchestration/models.yaml)이
# 구현한 구독과 다른 쪽을 고른다(같은 맹점을 덜 공유한다). 라우팅이 꺼져 있으면 orca.agent.
cleanup:
  auto_sweep: true             # launch.sh가 한 시간에 한 번 끝난 워커 워크트리를 정리한다(작업 merged·변경 없음·진행 중 디스패치 없음·1시간 넘게 쉼·고정 안 됨). 미리 보기: worktree_sweep.py

review:
  agent: ""
  model: ""
  effort: ""
  scope_escalate_after: 2      # 같은 작업에서 같은 차단 계열(models.py feedback --category)이 이만큼 연속이면 정지 점검이 '범위 결정 필요'
  recheck_effort_step: 1       # 같은 작업의 2회차 이후 검토(좁은 확인)는 effort를 이만큼 낮춘다(0이면 그대로, --effort를 주면 그것)

# 정해진 전이(advance.py): worker_done → 다음 단계. 판단이 필요한 것만 매니저에게 남긴다(교훈 L-24)
flow:
  auto_review: true            # 구현 '결과: 통과' → status review + 검토 투입(작업에 review: false면 병합 관문으로)
  auto_retry: true             # 검토 '판정: 차단 · 계열: X' → 실적 기록 + 보완 투입(같은 계열 연속이면 hold + 범위 결정)
  max_age_hours: 24            # 이보다 오래된 worker_done은 건너뛴다

# 멈춤 감시: status.py 정지 점검과 예약 점검(quota_watch.py install)이 쓴다
watch:
  stall: true                  # 예약 점검이 한도 말고 멈춤(커밋 없음·긴 명령·확인 창 대기)에도 매니저를 깨운다
  stale_min: 60                # 예약 점검의 '커밋 없음' 기준(분)
  long_cmd_min: 30             # 시간 제한 없는 시험·빌드 명령이 이보다 오래 돌면 '긴 명령'
  long_cmd_pattern: 'pytest|test\.sh|build\.sh|smoke|vitest|jest|cargo test|go test|npm (?:run )?test|ctest|colcon test|\bmake\b'
  auto_deny_rm: true           # 빈 변수 의심 rm 확인 창을 예약 점검이 거절하고 고쳐 쓸 꼴을 보낸다(승인 ID를 찾을 때만)

status:
  context_warn_k: 300          # 진행 중 워커의 지금 문맥이 이 천 토큰을 넘으면 '문맥 큼'

# 워크트리 사이 동시 실행 슬롯 (orchestration/tools/slot.sh <이름> -- <명령>)
slots:
  test: {{TEST_SLOTS}}                # {{TEST_SLOTS_NOTE}}

# 명세 문구
spec_text:
  perf_line: "처리 지연 p50/p95를 계기별로 측정해 report.md 3절에 표로 남긴다"
  no_perf_line: "처리 지연 측정은 필수가 아니다(해당 시 기록)"

# RTM 검증 단계 칸 (요구사항 추적표의 열 머리와 같아야 한다)
verification_stages:
{{VSTAGES_YAML}}

# 검토 단계(선택 모듈). enabled: false면 대시보드 카드와 단계 폴더를 쓰지 않는다
review_stages:
  enabled: {{REVIEW_ENABLED}}
  stages:
{{REVIEW_STAGES_YAML}}

orca:
  agent: claude                 # 워커 에이전트 (자동 라우팅을 안 쓰거나 후보가 없을 때)
  repo: ""                      # worker-start --repo 값 (예: id:<repoId>). `orca repo list --json`
  master_run: "{{MASTER_RUN}}"  # 마스터 Run (매니저 보고 수신처)
  work_run: "{{WORK_RUN}}"      # 매니저의 작업 Run (대시보드 --orca, launch·cleanup 기본값)
  manager_dispatch: ""          # 매니저 dispatch (worker-abandon 대상)

# 실행 격리 모듈(선택). 상세 설정은 scripts/run/run.conf
run:
  enabled: {{RUN_ENABLED}}
  remote: "{{REMOTE}}"           # user@host. 비우면 로컬 컨테이너
  profile: "{{RUN_PROFILE}}"     # 예: ros2 (scripts/run/profiles/<이름>)
  cleanup_hook: "{{CLEANUP_HOOK}}"

dashboard:
  title: "{{PROJECT_NAME}} 개발 현황"
  subtitle: "로컬·사설망 전용"
  port: 8765
  storage_key: "{{PROJECT_SLUG}}-dash"
